<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - Fire Village Gaming</title>
  <meta name="robots" content="noindex, nofollow"> <!-- Prevent search engines from indexing the admin portal -->
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ── ROOT VARS ── */
    :root {
      --fire-yellow: #facc15;
      --fire-orange: #f59e0b;
      --fire-red:    #ef4444;
      --fire-dark:   #0f0f0f;
      --fire-gray:   #1f2937;
      --fire-light:  #374151;
      --font-head:   'Oswald', sans-serif;
      --font-body:   'Poppins', sans-serif;
      --admin-accent: #3b82f6; /* A blue accent to differentiate admin from public */
      --admin-hover: #2563eb;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at center, #1a1f2e 0%, #0f0f0f 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background decoration */
    .bg-shape {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
      border-radius: 50%;
      top: -200px;
      right: -200px;
      z-index: 0;
      pointer-events: none;
    }
    .bg-shape-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(239,68,68,0.08) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -150px;
      left: -150px;
      z-index: 0;
      pointer-events: none;
    }

    /* ── AUTH CONTAINER ── */
    .admin-auth-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 0 24px;
      z-index: 10;
    }

    .auth-card {
      background: rgba(17,24,39,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(to right, var(--admin-accent), #60a5fa);
    }

    /* Header */
    .auth-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      height: 56px;
      width: auto;
    }
    .auth-title {
      font-family: var(--font-head);
      font-size: 2rem;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: #9ca3af;
      font-size: 0.9rem;
    }
    .admin-badge {
      display: inline-block;
      background: rgba(59,130,246,0.15);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      border: 1px solid rgba(59,130,246,0.3);
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #d1d5db;
      margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      font-size: 1rem;
      transition: color 0.3s;
    }
    .form-control {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 14px 16px 14px 44px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: all .3s;
    }
    .form-control:focus {
      border-color: var(--admin-accent);
      background: rgba(10,10,10,0.6);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .form-control:focus + i, .form-control:not(:placeholder-shown) + i { 
      color: var(--admin-accent); 
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--admin-accent);
      color: #fff;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all .3s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 30px;
    }
    .btn-submit:hover {
      background: var(--admin-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59,130,246,0.4);
    }
    .btn-submit:disabled { 
      background: #374151; color: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; 
    }

    .return-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #6b7280;
      font-size: 0.85rem;
      transition: color 0.2s;
      text-decoration: none;
      margin-top: 10px; /* Added margin for spacing */
      display: block; /* Ensure it takes full width */
      text-align: right; /* Align to the right */
      color: var(--admin-accent); /* Make it stand out */
    }
    .return-link:hover { color: #fff; }
    .return-link i { margin-right: 6px; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      top: 28px; right: 28px;
      background: #1f2937;
      border: 1px solid rgba(250,204,21,0.3);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.9rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      z-index: 9999;
      transform: translateX(120%);
      opacity: 0;
      transition: all .35s cubic-bezier(0.4,0,0.2,1);
      max-width: 340px;
    }
    .toast.show { transform: translateX(0); opacity: 1; }
    .toast.success { border-color: rgba(74,222,128,0.4); }
    .toast.error { border-color: rgba(248,113,113,0.4); }
    .toast i { font-size: 1.1rem; flex-shrink: 0; }
    .toast.success i { color: #4ade80; }
    .toast.error i { color: #f87171; }

    @media (max-width: 480px) {
      .auth-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <div class="bg-shape"></div>
  <div class="bg-shape-2"></div>

  <div class="admin-auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="admin-badge"><i class="fas fa-shield-alt"></i> Restricted Area</div>
        <div class="logo-container">
          <img src="../assets/logo.png" alt="Fire Village" onerror="this.style.display='none'">
        </div>
        <h1 class="auth-title">Admin Portal</h1>
        <p class="auth-subtitle">Log in to manage tournaments and players</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <div class="input-wrap">
            <input type="email" id="adminEmail" class="form-control" placeholder="admin@firevillage.in" required>
            <i class="fas fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <div class="input-wrap">
            <input type="password" id="adminPassword" class="form-control" placeholder="Enter secure password" required>
            <i class="fas fa-lock"></i>
          </div>
          <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          Secure Login <i class="fas fa-sign-in-alt"></i>
        </button>
      </form>

      <!-- Forgot Password Form -->
      <form id="forgotPasswordForm" style="display: none;">
        <div class="auth-header" style="margin-bottom: 20px;">
          <h2 class="auth-title" style="font-size: 1.6rem;">Reset Password</h2>
          <p class="auth-subtitle">Enter your admin email to receive a password reset link.</p>
        </div>
        <div class="form-group">
          <label for="resetEmail">Admin Email</label>
          <div class="input-wrap">
            <input type="email" id="resetEmail" class="form-control" placeholder="admin@firevillage.in" required>
            <i class="fas fa-envelope"></i>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="sendResetEmailBtn">
          Send Reset Link <i class="fas fa-paper-plane"></i>
        </button>
        <button type="button" class="btn-submit" id="backToLoginBtn" style="background: var(--fire-gray); margin-top: 15px;">
          <i class="fas fa-arrow-left"></i> Back to Login
        </button>
      </form>

      <a href="../index.html" class="return-link"><i class="fas fa-arrow-left"></i> Return to Public Site</a>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toastMsg"></span>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // TOAST UTILITY
    let toastTimer;
    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      const i = t.querySelector('i');
      t.querySelector('#toastMsg').textContent = msg;
      t.className = `toast ${type}`;
      i.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
    }

    // FORM SUBMISSION (Demo Logic)
    // Since Firebase needs backend setup for true custom claims, 
    // here we will simulate the admin login process.
    const loginForm = document.getElementById('adminLoginForm');
    const submitBtn = document.getElementById('submitBtn');
    
    // FORGOT PASSWORD ELEMENTS
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const forgotPasswordForm = document.getElementById('forgotPasswordForm');
    const resetEmailInput = document.getElementById('resetEmail');
    const sendResetEmailBtn = document.getElementById('sendResetEmailBtn');
    const backToLoginBtn = document.getElementById('backToLoginBtn');

    // Function to switch between login and forgot password forms
    function showLoginForm() {
      loginForm.style.display = 'block';
      forgotPasswordForm.style.display = 'none';
      resetEmailInput.value = ''; // Clear reset email field
    }

    function showForgotPasswordForm() {
      loginForm.style.display = 'none';
      forgotPasswordForm.style.display = 'block';
      document.getElementById('adminEmail').value = ''; // Clear login email field
      document.getElementById('adminPassword').value = ''; // Clear login password field
    }

    // Event listener for "Forgot Password?" link
    forgotPasswordLink.addEventListener('click', (e) => {
      e.preventDefault();
      showForgotPasswordForm();
    });

    // Event listener for "Back to Login" button
    backToLoginBtn.addEventListener('click', () => {
      showLoginForm();
    });

    // Event listener for sending reset email
    forgotPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = resetEmailInput.value.trim();

      if (!email) {
        showToast('Please enter your email address.', 'error');
        return;
      }

      sendResetEmailBtn.disabled = true;
      sendResetEmailBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

      try {
        await firebase.auth().sendPasswordResetEmail(email);
        showToast('Password reset email sent! Check your inbox.', 'success');
        setTimeout(() => {
          showLoginForm(); // Go back to login after sending email
        }, 2000);
      } catch (error) {
        console.error("Password reset failed:", error);
        let errorMessage = 'Failed to send password reset email.';
        if (error.code === 'auth/user-not-found') {
          errorMessage = 'No user found with that email address.';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Invalid email address format.';
        }
        showToast(errorMessage, 'error');
      } finally {
        sendResetEmailBtn.disabled = false;
        sendResetEmailBtn.innerHTML = 'Send Reset Link <i class="fas fa-paper-plane"></i>';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Check if Firebase is ready before proceeding with authentication
      if (!firebaseReady) {
        showToast('Firebase is not initialized. Please check your internet connection or console for errors.', 'error');
        return;
      }

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      // FIREBASE AUTHENTICATION (Login)
      try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Check user role from Firestore
        const userDoc = await firebase.firestore().collection('users').doc(user.uid).get();

        if (userDoc.exists && userDoc.data().role === 'admin') {
          showToast('Authentication successful. Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          showToast('Access Denied: You are not authorized to view this page.', 'error');
          await firebase.auth().signOut(); // Sign out non-admin users
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Secure Login <i class="fas fa-sign-in-alt"></i>';
        }
      } catch (error) {
        console.error("Login failed:", error);
        let errorMessage = 'Login failed. Please check your credentials.';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errorMessage = 'Invalid email or password.';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'Too many failed login attempts. Please try again later.';
        }
        showToast(errorMessage, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Secure Login <i class="fas fa-sign-in-alt"></i>';
        adminPassword.value = ''; // Clear password on failed attempt
      }
    });
  </script>
  <script src="auth-ui.js" defer></script>

      <script src="firebase-init.js" defer></script>

      <script src="toast.js" defer></script>
  </script>    
</body>
</html>

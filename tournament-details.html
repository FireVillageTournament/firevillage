<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Details - Fire Village Gaming</title>
  <meta name="description" content="View specific tournament details, rules, and registered teams at Fire Village.">
  <link rel="icon" href="./assets/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --fire-yellow: #facc15;
      --fire-orange: #f59e0b;
      --fire-red: #ef4444;
      --fire-dark: #0f0f0f;
      --fire-gray: #1f2937;
      --font-head: 'Oswald', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--fire-dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: var(--fire-orange); border-radius: 3px; }

    a { text-decoration: none; color: inherit; }

    nav {
      background: rgba(17,24,39,0.95);
      backdrop-filter: blur(12px);
      padding: 0 24px;
      height: 68px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(250,204,21,0.12);
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-wrap img { height: 44px; width: auto; }
    .logo-wrap span {
      font-family: var(--font-head);
      font-size: 1.5rem;
      color: var(--fire-yellow);
    }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
    .nav-links a {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #d1d5db;
    }
    .nav-links a:hover, .nav-links a.active {
      background: var(--fire-yellow);
      color: #000;
    }
    .nav-links a i { margin-right: 6px; }

    .auth-area { display: flex; align-items: center; gap: 10px; }
    .btn-login {
      padding: 8px 18px;
      border-radius: 8px;
      color: #d1d5db;
      font-weight: 500;
    }
    .btn-login:hover { color: var(--fire-yellow); }
    .btn-join {
      padding: 9px 20px;
      border-radius: 8px;
      background: linear-gradient(to right, var(--fire-orange), var(--fire-red));
      color: #000;
      font-weight: 700;
    }

    .user-menu-wrap { position: relative; }
    .user-btn {
      background: none;
      border: 1px solid rgba(250,204,21,0.3);
      border-radius: 8px;
      padding: 8px 16px;
      color: #d1d5db;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 180px;
      background: #1f2937;
      border: 1px solid rgba(250,204,21,0.15);
      border-radius: 10px;
      padding: 8px 0;
      z-index: 200;
    }
    .user-dropdown.open { display: block; }
    .user-dropdown a {
      display: block;
      padding: 10px 16px;
      color: #d1d5db;
    }
    .user-dropdown a:hover { background: rgba(255,255,255,0.06); color: var(--fire-yellow); }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.6rem;
      cursor: pointer;
    }
    .mobile-menu {
      display: none;
      position: absolute;
      top: 68px;
      left: 0;
      right: 0;
      background: rgba(10,10,15,0.98);
      backdrop-filter: blur(16px);
      padding: 16px;
      z-index: 999;
      flex-direction: column;
      gap: 6px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      padding: 13px 18px;
      border-radius: 8px;
      color: #d1d5db;
    }

    .page-header {
      padding: 60px 24px;
      background: linear-gradient(to bottom, rgba(17,24,39,0.9), rgba(15,15,15,1));
      text-align: center;
    }
    .t-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--fire-yellow);
      margin-bottom: 12px;
    }
    .t-status-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 99px;
    }
    .t-status-badge.open { background: rgba(34,197,94,0.15); color: #4ade80; }
    .t-status-badge.upcoming { background: rgba(250,204,21,0.15); color: var(--fire-yellow); }
    .t-status-badge.full { background: rgba(239,68,68,0.15); color: #f87171; }

    main { flex: 1; padding: 40px 24px; }
    .details-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
    }
    .left-col section {
      background: rgba(17,24,39,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 24px;
    }
    .sec-title {
      font-family: var(--font-head);
      font-size: 1.6rem;
      color: var(--fire-yellow);
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
    }
    .desc-text { color: #d1d5db; line-height: 1.7; }
    .rules-list { list-style: none; color: #d1d5db; }
    .rules-list li { margin-bottom: 12px; display: flex; gap: 10px; }
    .rules-list li i { color: var(--fire-orange); margin-top: 4px; }

    .sidebar-card {
      background: linear-gradient(145deg, rgba(15,15,15,0.9), rgba(17,24,39,1));
      border: 1px solid rgba(250,204,21,0.2);
      border-radius: 16px;
      padding: 30px;
      position: sticky;
      top: 100px;
    }
    .s-meta-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .s-meta-lbl { color: #9ca3af; display: flex; align-items: center; gap: 8px; }
    .s-meta-lbl i { color: var(--fire-yellow); width: 16px; }
    .s-meta-val { color: #fff; font-weight: 600; }
    .s-prize {
      text-align: center;
      background: rgba(250,204,21,0.05);
      border: 1px dashed rgba(250,204,21,0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .s-prize h4 { font-family: var(--font-head); color: var(--fire-yellow); font-size: 2rem; }
    .s-progress-wrap { margin-bottom: 24px; }
    .s-progress-lbl { display: flex; justify-content: space-between; font-size: 0.85rem; color: #d1d5db; margin-bottom: 8px; }
    .s-progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .s-progress-fill { height: 100%; background: linear-gradient(to right, var(--fire-orange), var(--fire-red)); width: 0%; }

    .btn-main {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      background: linear-gradient(to right, var(--fire-orange), var(--fire-red));
    }
    .btn-main:hover {
      background: linear-gradient(to right, var(--fire-yellow), var(--fire-orange));
      transform: translateY(-2px);
    }
    .btn-main.disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Registered Teams Table */
    .teams-table-container {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .teams-table {
      width: 100%;
      border-collapse: collapse;
    }
    .teams-table th {
      padding: 14px 16px;
      text-align: left;
      font-family: var(--font-head);
      color: var(--fire-yellow);
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .teams-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #d1d5db;
    }
    .teams-table tr:hover {
      background: rgba(250,204,21,0.05);
    }
    .team-rank {
      font-weight: 700;
      color: var(--fire-yellow);
      font-size: 1.1rem;
    }
    .captain-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(250,204,21,0.1);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .captain-badge i { color: var(--fire-yellow); font-size: 0.7rem; }

    .loading-view { text-align: center; padding: 80px 24px; color: #9ca3af; }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(250,204,21,0.2);
      border-top-color: var(--fire-yellow);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      background: #111827;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 32px 24px;
      text-align: center;
      margin-top: auto;
    }
    .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
    .footer-links a { color: #9ca3af; font-size: 0.88rem; }
    .footer-links a:hover { color: var(--fire-yellow); }

    @media (max-width: 1024px) {
      .nav-links, .auth-area { display: none; }
      .hamburger { display: block; }
      .details-wrap { grid-template-columns: 1fr; }
      .sidebar-card { position: static; }
    }
  </style>
</head>

<body>
  <nav id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo-wrap"><img src="./assets/logo.png" alt="Logo" onerror="this.style.display='none'"><span>FIRE VILLAGE</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="tournaments.html" class="active">Tournaments</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="teams.html">Teams</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="auth-area" id="authArea"></div>
      <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    </div>
    <div class="mobile-menu" id="mobileMenu"></div>
  </nav>

  <div id="contentContainer"><div class="loading-view"><div class="spinner"></div><p>Loading tournament details...</p></div></div>

  <footer>
    <div class="footer-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="contact.html">Contact Us</a>
    </div>
    <p>&copy; <span id="copyright-year"></span> Fire Village Tournament. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDFjHR5_D6yQ9tXrEut-3c2o4oA1ddz6hQ",
      authDomain: "firevillagetournament.firebaseapp.com",
      projectId: "firevillagetournament",
      storageBucket: "firevillagetournament.firebasestorage.app",
      messagingSenderId: "511246704009",
      appId: "1:511246704009:web:8ae5e484591a64bb735558"
    };

    let db, auth;
    let currentUser = null;
    let tournament = null;

    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();

    // Auth UI
    function renderAuth(user) {
      const authArea = document.getElementById('authArea');
      const mobileMenu = document.getElementById('mobileMenu');
      const navRegisterLink = document.querySelector('.nav-links a[href="register.html"]');

      if (user) {
        const name = user.displayName || user.email?.split('@')[0] || 'Player';
        if (navRegisterLink) navRegisterLink.parentElement.style.display = 'none';
        authArea.innerHTML = `
          <div class="user-menu-wrap">
            <button class="user-btn" id="userBtn"><i class="fas fa-user-circle"></i> ${name} <i class="fas fa-chevron-down"></i></button>
            <div class="user-dropdown" id="userDropdown">
              <a href="profile.html">Profile</a>
              <a href="#" id="logoutBtn">Logout</a>
            </div>
          </div>`;
        mobileMenu.innerHTML = `<a href="index.html">Home</a><a href="tournaments.html" class="active">Tournaments</a><a href="leaderboard.html">Leaderboard</a><a href="teams.html">Teams</a><a href="profile.html">Profile</a><a href="#" id="mobileLogout">Logout</a>`;
        document.getElementById('userBtn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('userDropdown')?.classList.toggle('open');
        });
        document.getElementById('logoutBtn')?.addEventListener('click', (e) => { e.preventDefault(); auth.signOut(); });
        document.getElementById('mobileLogout')?.addEventListener('click', (e) => { e.preventDefault(); auth.signOut(); });
      } else {
        if (navRegisterLink) navRegisterLink.parentElement.style.display = '';
        authArea.innerHTML = `<a href="login.html" class="btn-login">Login</a><a href="register.html" class="btn-join">Join Now</a>`;
        mobileMenu.innerHTML = `<a href="index.html">Home</a><a href="tournaments.html" class="active">Tournaments</a><a href="leaderboard.html">Leaderboard</a><a href="teams.html">Teams</a><a href="login.html">Login</a><a href="register.html">Register</a>`;
      }
      document.addEventListener('click', () => document.getElementById('userDropdown')?.classList.remove('open'));
    }

    function formatDate(val) {
      if (!val) return 'TBD';
      let date;
      if (val.seconds) {
        date = new Date(val.seconds * 1000);
      } else {
        date = new Date(val);
      }
      if (isNaN(date)) return 'Invalid Date';
      return date.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatCurrency(amount) {
      return `₹${(amount || 0).toLocaleString('en-IN')}`;
    }

    function handleRegisterClick() {
      if (!currentUser) {
        alert('Please login to register');
        window.location.href = 'login.html';
        return;
      }
      if (tournament && tournament.id) {
        window.location.href = `payment.html?tournament=${tournament.id}`;
      }
    }

    // Load registered teams for this tournament (only confirmed registrations)
    async function loadRegisteredTeams(tournamentId) {
      const tbody = document.getElementById('registeredTeamsList');
      if (!tbody) return;

      try {
        // Get confirmed registrations for this tournament
        const regSnap = await db.collection('registrations')
          .where('tournamentId', '==', tournamentId)
          .where('status', '==', 'confirmed')
          .get();

        if (regSnap.empty) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 40px; color: #9ca3af;">No teams have registered for this tournament yet.</td></tr>`;
          return;
        }
        
        let regs = regSnap.docs.map(doc => doc.data());
        regs.sort((a, b) => {
          const tA = a.createdAt ? (a.createdAt.seconds || 0) : 0;
          const tB = b.createdAt ? (b.createdAt.seconds || 0) : 0;
          return tA - tB;
        });

        let rank = 1;
        tbody.innerHTML = regs.map(regData => {
          const registrationDate = regData.createdAt ? formatDate(regData.createdAt) : 'N/A';
          const captainName = regData.captainName || regData.teamCaptain || 'N/A';

          return `
            <tr>
              <td><span class="team-rank">#${rank++}</span></td>
              <td><a href="team-details.html?id=${regData.teamId}" style="color: #fff; font-weight: bold; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--fire-yellow)'" onmouseout="this.style.color='#fff'">${escapeHtml(regData.teamName)}</a></td>
              <td>
                <span class="captain-badge">
                  <i class="fas fa-crown"></i>
                  ${escapeHtml(captainName)}
                </span>
              </td>
              <td>${registrationDate}</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error("Error loading registered teams:", err);
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 40px; color: #ef4444;">Error loading teams. Please refresh.</td></tr>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderTournament() {
      const container = document.getElementById('contentContainer');
      if (!tournament) {
        container.innerHTML = `<div class="loading-view"><i class="fas fa-exclamation-triangle" style="font-size:3rem;"></i><h2>Tournament Not Found</h2><a href="tournaments.html" style="color:var(--fire-yellow);">Back to Tournaments</a></div>`;
        return;
      }

      const pct = Math.min(100, Math.round(((tournament.registeredTeams || 0) / tournament.maxTeams) * 100));
      const isFull = (tournament.registeredTeams || 0) >= tournament.maxTeams;
      const statusClass = isFull ? 'full' : (tournament.status || 'upcoming');
      const statusLabel = isFull ? 'FULL' : (tournament.status?.toUpperCase() || 'UPCOMING');

      const rules = tournament.rules || [
        'Cheating of any kind is strictly prohibited',
        'All players must use registered in-game names',
        'Match timings are final; late entries will be disqualified',
        'Respect all players and admins'
      ];

      container.innerHTML = `
        <section class="page-header">
          <h1 class="t-title">${escapeHtml(tournament.name)}</h1>
          <span class="t-status-badge ${statusClass}">${statusLabel}</span>
        </section>
        <main>
          <div class="details-wrap">
            <div class="left-col">
              <section>
                <h2 class="sec-title">About the Tournament</h2>
                <p class="desc-text">${escapeHtml(tournament.description || 'Compete against the best teams and win exciting prizes. Register your team now!')}</p>
              </section>
              <section>
                <h2 class="sec-title">Rules & Guidelines</h2>
                <ul class="rules-list">${rules.map(r => `<li><i class="fas fa-check-circle"></i> <span>${escapeHtml(r)}</span></li>`).join('')}</ul>
              </section>
              <section>
                <h2 class="sec-title">
                  <i class="fas fa-users"></i> Registered Teams 
                  <span style="font-size: 0.9rem; color: var(--fire-yellow);">(${tournament.registeredTeams || 0}/${tournament.maxTeams})</span>
                </h2>
                <div class="teams-table-container">
                  <table class="teams-table">
                    <thead>
                      <tr>
                        <th style="width: 70px;">#</th>
                        <th>Team Name</th>
                        <th>Team Captain</th>
                        <th>Registered On</th>
                      </tr>
                    </thead>
                    <tbody id="registeredTeamsList">
                      <tr><td colspan="4" style="text-align: center; padding: 40px;"><div class="spinner"></div><p>Loading registered teams...</p></td></tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
            <div class="right-col">
              <div class="sidebar-card">
                <div class="s-prize"><h4>${formatCurrency(tournament.prizePool)}</h4><span>Total Prize Pool</span></div>
                <div class="s-meta">
                  <div class="s-meta-item"><span class="s-meta-lbl"><i class="fas fa-calendar"></i> Starts</span><span class="s-meta-val" style="text-align: right; font-size: 0.9rem;">${formatDate(tournament.startDate)}</span></div>
                  <div class="s-meta-item"><span class="s-meta-lbl"><i class="fas fa-calendar-check"></i> Ends</span><span class="s-meta-val" style="text-align: right; font-size: 0.9rem;">${formatDate(tournament.endDate)}</span></div>
                  <div class="s-meta-item"><span class="s-meta-lbl"><i class="fas fa-gamepad"></i> Game</span><span class="s-meta-val">${escapeHtml(tournament.game || 'BGMI')}</span></div>
                  <div class="s-meta-item"><span class="s-meta-lbl"><i class="fas fa-rupee-sign"></i> Entry Fee</span><span class="s-meta-val">${formatCurrency(tournament.fee)}</span></div>
                  <div class="s-meta-item"><span class="s-meta-lbl"><i class="fas fa-users"></i> Format</span><span class="s-meta-val">${escapeHtml(tournament.format || 'Team')}</span></div>
                </div>
                <div class="s-progress-wrap">
                  <div class="s-progress-lbl"><span>Teams Registered</span><span>${tournament.registeredTeams || 0}/${tournament.maxTeams}</span></div>
                  <div class="s-progress-bar"><div class="s-progress-fill" style="width:${pct}%"></div></div>
                </div>
                <button class="btn-main ${isFull || tournament.status !== 'open' ? 'disabled' : ''}" onclick="handleRegisterClick()">
                  ${!currentUser ? '<i class="fas fa-sign-in-alt"></i> Login to Register' : 
                    isFull ? '<i class="fas fa-ban"></i> Slots Full' :
                    tournament.status !== 'open' ? `<i class="fas fa-clock"></i> ${tournament.status?.toUpperCase() || 'Closed'}` : '<i class="fas fa-user-plus"></i> Register Now'}
                </button>
              </div>
            </div>
          </div>
        </main>
      `;

      // Load registered teams after rendering
      loadRegisteredTeams(tournament.id);
    }

    async function loadTournament() {
      const params = new URLSearchParams(window.location.search);
      const tId = params.get('id');
      if (!tId) {
        tournament = null;
        renderTournament();
        return;
      }

      try {
        const doc = await db.collection('tournaments').doc(tId).get();
        if (doc.exists) {
          tournament = { id: doc.id, ...doc.data() };
          renderTournament();
        } else {
          tournament = null;
          renderTournament();
        }
      } catch (err) {
        console.error(err);
        tournament = null;
        renderTournament();
      }
    }

    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => mobileMenu.classList.toggle('open'));

    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      renderAuth(user);
      await loadTournament();
    });

    document.getElementById('copyright-year').textContent = new Date().getFullYear();
    window.handleRegisterClick = handleRegisterClick;
  </script>
</body>
</html>

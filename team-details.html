<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Profile - Fire Village Gaming</title>
  <meta name="description" content="View team details, roster, and statistics at Fire Village.">
  <link rel="icon" href="./assets/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ── ROOT VARS ── */
    :root {
      --fire-yellow: #facc15;
      --fire-orange: #f59e0b;
      --fire-red:    #ef4444;
      --fire-dark:   #0f0f0f;
      --fire-gray:   #1f2937;
      --fire-light:  #374151;
      --fire-bg:     #111827;
      --font-head:   'Oswald', sans-serif;
      --font-body:   'Poppins', sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      font-family: var(--font-body);
      background: var(--fire-dark);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#111; }
    ::-webkit-scrollbar-thumb { background: var(--fire-orange); border-radius:3px; }

    a { text-decoration:none; color:inherit; transition:all .3s ease; }
    img { display:block; max-width:100%; }

    /* ── NAVBAR ── */
    nav {
      background: rgba(17,24,39,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0 24px;
      height: 68px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(250,204,21,0.12);
      transition: background .3s;
    }
    nav.scrolled {
      background: rgba(10,10,10,0.98);
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-wrap img {
      height: 44px;
      width: auto;
      transition: transform .3s;
    }
    .logo-wrap:hover img { transform: scale(1.08); }
    .logo-wrap span {
      font-family: var(--font-head);
      font-size: 1.5rem;
      color: var(--fire-yellow);
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }
    .nav-links a {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #d1d5db;
      transition: all .25s;
    }
    .nav-links a:hover, .nav-links a.active {
      background: var(--fire-yellow);
      color: #000;
    }
    .nav-links a i { margin-right:6px; }

    /* Auth buttons */
    .auth-area { display:flex; align-items:center; gap:10px; }
    .btn-login {
      padding: 8px 18px;
      border-radius: 8px;
      color: #d1d5db;
      font-weight: 500;
      font-size: 0.88rem;
    }
    .btn-login:hover { color: var(--fire-yellow); }
    .btn-join {
      padding: 9px 20px;
      border-radius: 8px;
      background: linear-gradient(to right, var(--fire-orange), var(--fire-red));
      color: #000;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all .3s;
    }
    .btn-join:hover {
      background: linear-gradient(to right, var(--fire-yellow), var(--fire-orange));
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(245,158,11,0.4);
    }

    /* User menu */
    .user-menu-wrap { position:relative; }
    .user-btn {
      background: none;
      border: 1px solid rgba(250,204,21,0.3);
      border-radius: 8px;
      padding: 8px 16px;
      color: #d1d5db;
      font-family: var(--font-body);
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .25s;
    }
    .user-btn:hover { border-color: var(--fire-yellow); color: var(--fire-yellow); }
    .user-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 180px;
      background: #1f2937;
      border: 1px solid rgba(250,204,21,0.15);
      border-radius: 10px;
      padding: 8px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 200;
    }
    .user-dropdown.open { display:block; }
    .user-dropdown a {
      display: block;
      padding: 10px 16px;
      font-size: 0.88rem;
      color: #d1d5db;
    }
    .user-dropdown a:hover { background: rgba(255,255,255,0.06); color: var(--fire-yellow); }
    .user-dropdown a.logout { color: #f87171; }
    .user-dropdown a.logout:hover { background: rgba(248,113,113,0.08); }

    /* Hamburger */
    .hamburger {
      display: none;
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color .25s;
    }
    .hamburger:hover { color: var(--fire-yellow); }

    /* Mobile menu */
    .mobile-menu {
      display: none;
      position: absolute;
      top: 68px;
      left: 0;
      right: 0;
      background: rgba(10,10,15,0.98);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(250,204,21,0.1);
      padding: 16px;
      z-index: 999;
      flex-direction: column;
      gap: 6px;
    }
    .mobile-menu.open { display:flex; }
    .mobile-menu a {
      padding: 13px 18px;
      border-radius: 8px;
      font-weight: 500;
      color: #d1d5db;
      font-size: 1rem;
    }
    .mobile-menu a:hover, .mobile-menu a.active {
      background: var(--fire-yellow);
      color: #000;
    }
    .mobile-menu .mobile-auth {
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: 8px;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mobile-menu .btn-join-mobile {
      text-align: center;
      padding: 13px;
      border-radius: 8px;
      background: linear-gradient(to right, var(--fire-orange), var(--fire-red));
      color: #000;
      font-weight: 700;
    }

    /* ── PAGE HEADER (Team Banner) ── */
    .team-banner {
      padding: 60px 24px;
      background: linear-gradient(to bottom, rgba(17,24,39,0.9), rgba(15,15,15,1));
      border-bottom: 1px solid rgba(250,204,21,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .team-avatar-large {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 4px solid var(--fire-yellow);
      background: linear-gradient(135deg, var(--fire-orange), var(--fire-red));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head);
      font-size: 3rem;
      font-weight: 700;
      color: #000;
      box-shadow: 0 10px 30px rgba(239,68,68,0.4);
      margin-bottom: 20px;
    }
    .t-title {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--fire-yellow);
      margin-bottom: 12px;
    }
    .t-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(250,204,21,0.15); 
      color: var(--fire-yellow); 
      border: 1px solid rgba(250,204,21,0.3);
    }

    /* ── CONTENT LAYOUT ── */
    main { flex: 1; padding: 40px 24px; }
    .details-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 32px;
    }
    
    /* Left Column (Stats & History) */
    .left-col section {
      background: rgba(17,24,39,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 24px;
    }
    .sec-title {
      font-family: var(--font-head);
      font-size: 1.6rem;
      color: var(--fire-yellow);
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .desc-text { color: #d1d5db; font-size: 1rem; line-height: 1.7; margin-bottom: 16px; }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all .3s;
    }
    .stat-box:hover { border-color: rgba(250,204,21,0.3); background: rgba(250,204,21,0.03); }
    .stat-value { font-family: var(--font-head); font-size: 2rem; color: var(--fire-yellow); margin-bottom: 4px; line-height: 1;}
    .stat-label { color: #9ca3af; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

    /* History List */
    .history-list { display: flex; flex-direction: column; gap: 12px; }
    .history-item {
      background: rgba(0,0,0,0.3);
      border-left: 3px solid var(--fire-orange);
      padding: 16px 20px;
      border-radius: 0 8px 8px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-event { color: #fff; font-weight: 600; font-size: 1rem; }
    .history-placement { color: var(--fire-yellow); font-family: var(--font-head); font-size: 1.1rem; }

    /* Right Column / Roster */
    .right-col { position: relative; }
    .sidebar-card {
      background: linear-gradient(145deg, rgba(15,15,15,0.9), rgba(17,24,39,1));
      border: 1px solid rgba(250,204,21,0.2);
      border-radius: 16px;
      padding: 30px;
      position: sticky;
      top: 100px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }
    .roster-list { display: flex; flex-direction: column; gap: 16px; }
    .roster-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      transition: all .2s;
    }
    .roster-item:hover { background: rgba(250,204,21,0.05); border-color: rgba(250,204,21,0.2); }
    .player-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #1f2937;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-info { flex: 1; }
    .player-name { color: #fff; font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
    .player-role { color: #9ca3af; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .cap-badge { color: var(--fire-yellow); font-size: 0.9rem; margin-left: auto; }

    /* Loading state */
    .loading-view { text-align: center; padding: 80px 24px; color: #9ca3af; }
    .loading-view .spinner { width: 40px; height: 40px; border-width: 4px; margin-bottom: 16px; }

    /* ── FOOTER ── */
    footer {
      background: #111827; border-top: 1px solid rgba(255,255,255,0.06);
      padding: 32px 24px; text-align: center; margin-top: auto;
    }
    .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 18px; }
    .footer-links a { color: #9ca3af; font-size: 0.88rem; }
    .footer-links a:hover { color: var(--fire-yellow); }
    footer p { color: #4b5563; font-size: 0.82rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .nav-links, .auth-area { display: none; }
      .hamburger { display: block; }
      .details-wrap { grid-template-columns: 1fr; }
      .sidebar-card { position: static; margin-top: 20px; }
    }
  </style>
</head>

      <ul class="nav-links">

    <!-- Mobile menu -->

      <a href="index.html"><i class="fas fa-home" style="margin-right:10px;color:var(--fire-yellow)"></i>Home</a>
      <a href="tournaments.html"><i class="fas fa-trophy" style="margin-right:10px;color:var(--fire-yellow)"></i>Tournaments</a>
      <a href="leaderboard.html"><i class="fas fa-medal" style="margin-right:10px;color:var(--fire-yellow)"></i>Leaderboard</a>
      <a href="teams.html" class="active"><i class="fas fa-users" style="margin-right:10px;color:var(--fire-yellow)"></i>Teams</a>

      <a href="contact.html"><i class="fas fa-envelope" style="margin-right:10px;color:var(--fire-yellow)"></i>Contact</a>
      <a href="about.html"><i class="fas fa-info-circle" style="margin-right:10px;color:var(--fire-yellow)"></i>About</a>
      <div class="mobile-auth" id="mobileAuthArea"></div>
    </div>
  </nav>

  <!-- Placeholder container while loading -->
  <div id="contentContainer">
    <div class="loading-view">
      <div class="spinner" style="border-top-color: var(--fire-yellow);"></div>
      <p>Loading team profile...</p>
    </div>
  </div>

  <!-- ── FOOTER ── -->
  <footer>
    <div class="footer-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="shipping.html">Shipping Policy</a>
      <a href="contact.html">Contact Us</a>
    </div>
    <p>&copy; <span id="copyright-year"></span> Fire Village Tournament. All rights reserved.</p>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
  // ════════════════════════════════════════════════
  // FIREBASE CONFIG
  // ════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey: "AIzaSyDFjHR5_D6yQ9tXrEut-3c2o4oA1ddz6hQ",
    authDomain: "firevillagetournament.firebaseapp.com",
    projectId: "firevillagetournament",
    storageBucket: "firevillagetournament.firebasestorage.app",
    messagingSenderId: "511246704009",
    appId: "1:511246704009:web:8ae5e484591a64bb735558",
    measurementId: "G-ZCQ2V6DEGX"
  };

  let db = null, auth = null;
  let firebaseReady = false;

  try {
    firebase.initializeApp(firebaseConfig);
    db   = firebase.firestore();
    auth = firebase.auth();
    firebaseReady = true;
  } catch(e) {
    console.warn("Firebase not configured — using demo data.", e);
  }

  // DEMO DATA (Fallback if DB query fails)
  const ALL_DEMO_TEAMS = [
    {
      id: 'tm1', name: 'Shadow Squad', initials: 'SS',
      stats: { played: 50, wins: 14, kills: 1200, points: 15000 },
      description: 'One of the most feared squads on the platform. Known for their aggressive rush gameplay and perfect coordination under pressure.',
      roster: [
        { name: 'xHunter_99', role: 'Captain / Assaulter', isCap: true },
        { name: 'SniperPro', role: 'Sniper', isCap: false },
        { name: 'Ninja_FF', role: 'Flanker', isCap: false },
        { name: 'HealerBoy', role: 'Support', isCap: false }
      ],
      history: [
        { event: 'Village Cup — Season 7', placement: '1st Place' },
        { event: 'Booyah Blitz — March', placement: '3rd Place' },
        { event: 'Solo King Clash', placement: 'Top 10' }
      ]
    },
    {
      id: 'tm2', name: 'Fire Wolves', initials: 'FW',
      stats: { played: 48, wins: 11, kills: 1150, points: 13500 },
      description: 'A deeply strategic team that relies on tactical positioning and survival to secure victory.',
      roster: [
        { name: 'BloodRayne_FF', role: 'Captain', isCap: true },
        { name: 'Viper_007', role: 'Assaulter', isCap: false },
        { name: 'GhostStrike', role: 'Sniper', isCap: false },
        { name: 'IceKing', role: 'Support', isCap: false }
      ],
      history: [
        { event: 'Fire Village Grand Prix', placement: '2nd Place' }
      ]
    }
  ];

  // ════════════════════════════════
  // NAVBAR LOGIC
  // ════════════════════════════════
  const navbar       = document.getElementById('navbar');
  const hamburger    = document.getElementById('hamburger');
  const hamburgerIcon= document.getElementById('hamburgerIcon');
  const mobileMenu   = document.getElementById('mobileMenu');

  window.addEventListener('scroll', ()=>{
    navbar.classList.toggle('scrolled', window.scrollY > 40);
  }, {passive:true});

  hamburger.addEventListener('click', ()=>{
    const open = mobileMenu.classList.toggle('open');
    hamburgerIcon.className = open ? 'fas fa-times' : 'fas fa-bars';
  });
  mobileMenu.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', ()=>{
      mobileMenu.classList.remove('open');
      hamburgerIcon.className = 'fas fa-bars';
    });
  });

  function renderAuth(user) {
    const authArea   = document.getElementById('authArea');
    const mobileAuth = document.getElementById('mobileAuthArea');
    if (user) {
      const displayName = user.displayName || user.email?.split('@')[0] || 'Player';
      authArea.innerHTML = `
        <div class="user-menu-wrap">
          <button class="user-btn" id="userBtn"><i class="fas fa-user-circle"></i> <span>${displayName}</span> <i class="fas fa-chevron-down" style="font-size:.7rem;"></i></button>
          <div class="user-dropdown" id="userDropdown">
            <a href="profile.html"><i class="fas fa-user-circle" style="margin-right:8px;color:var(--fire-yellow)"></i>Profile</a>
            <a href="#" id="logoutBtn" class="logout"><i class="fas fa-sign-out-alt" style="margin-right:8px;"></i>Logout</a>
          </div>
        </div>`;
      mobileAuth.innerHTML = `
        <a href="profile.html"><i class="fas fa-user-circle" style="margin-right:10px;color:var(--fire-yellow)"></i>${displayName}'s Profile</a>
        <a href="#" id="mobileLogout" style="color:#f87171;"><i class="fas fa-sign-out-alt" style="margin-right:10px;"></i>Logout</a>`;

      document.getElementById('userBtn')?.addEventListener('click', e=>{
        e.stopPropagation(); document.getElementById('userDropdown')?.classList.toggle('open');
      });
      document.getElementById('logoutBtn')?.addEventListener('click', e=>{
        e.preventDefault(); if(auth) auth.signOut();
      });
      document.getElementById('mobileLogout')?.addEventListener('click', e=>{
        e.preventDefault(); if(auth) auth.signOut();
      });
    } else {
      authArea.innerHTML = `<a href="login.html" class="btn-login"><i class="fas fa-sign-in-alt" style="margin-right:6px;"></i>Login</a><a href="register.html" class="btn-join"><i class="fas fa-user-plus" style="margin-right:6px;"></i>Join Now</a>`;
      mobileAuth.innerHTML = `<a href="login.html"><i class="fas fa-sign-in-alt" style="margin-right:10px;color:var(--fire-yellow)"></i>Login</a><a href="register.html" class="btn-join-mobile"><i class="fas fa-user-plus" style="margin-right:8px;"></i>Join Now</a>`;
    }
    document.addEventListener('click', ()=>document.getElementById('userDropdown')?.classList.remove('open'));
  }

  if (firebaseReady && auth) auth.onAuthStateChanged(user => renderAuth(user));
  else renderAuth(null);

  // ════════════════════════════════
  // RENDER TEAM DETAILS
  // ════════════════════════════════
  function renderTeam(team) {
    const container = document.getElementById('contentContainer');
    if(!team) {
      container.innerHTML = `
        <div class="loading-view" style="color:#ef4444;">
          <i class="fas fa-exclamation-triangle" style="font-size:3rem; margin-bottom:16px;"></i>
          <h2>Team Not Found</h2>
          <p>The team you are looking for does not exist or has been disbanded.</p>
          <br><a href="teams.html" style="color:var(--fire-yellow); text-decoration:underline;">Back to Teams Directory</a>
        </div>`;
      return;
    }

    // Safe fallbacks if data missing
    const desc = team.description || 'An active squad competing on the Fire Village platform.';
    const stats = team.stats || { played: 0, wins: 0, kills: 0, points: 0 };
    const roster = team.roster || [];
    const history = team.history || [];

    const rosterHtml = roster.length > 0 ? roster.map(p => `
      <div class="roster-item">
        <div class="player-avatar"><i class="fas fa-user"></i></div>
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-role">${p.role}</div>
        </div>
        ${p.isCap ? '<div class="cap-badge" title="Team Captain"><i class="fas fa-crown"></i></div>' : ''}
      </div>
    `).join('') : '<p class="desc-text">Roster details are currently private.</p>';

    const historyHtml = history.length > 0 ? history.map(h => `
      <div class="history-item">
        <span class="history-event">${h.event}</span>
        <span class="history-placement">${h.placement}</span>
      </div>
    `).join('') : '<p class="desc-text">No recent tournament history available.</p>';

    container.innerHTML = `
      <section class="team-banner">
        <div class="team-avatar-large">${team.initials || team.name.substring(0,2).toUpperCase()}</div>
        <h1 class="t-title">${team.name}</h1>
        <div class="t-status-badge">
          <i class="fas fa-trophy"></i> Elite Squad
        </div>
      </section>

      <main>
        <div class="details-wrap">
          <!-- Left Column -->
          <div class="left-col">
            <section>
              <h2 class="sec-title"><i class="fas fa-chart-bar"></i> Team Statistics</h2>
              <div class="stats-grid">
                <div class="stat-box">
                  <div class="stat-value">${stats.played}</div>
                  <div class="stat-label">Matches</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value">${stats.wins}</div>
                  <div class="stat-label">Wins</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value">${stats.kills}</div>
                  <div class="stat-label">Kills</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value">${(stats.points || 0).toLocaleString('en-IN')}</div>
                  <div class="stat-label">Points</div>
                </div>
              </div>
              <p class="desc-text" style="margin-top: 16px;">${desc}</p>
            </section>
            
            <section>
              <h2 class="sec-title"><i class="fas fa-history"></i> Recent Achievements</h2>
              <div class="history-list">
                ${historyHtml}
              </div>
            </section>
          </div>

          <!-- Right Column (Roster) -->
          <div class="right-col">
            <div class="sidebar-card">
              <h2 class="sec-title" style="font-size:1.4rem; margin-bottom: 24px;">Active Roster</h2>
              <div class="roster-list">
                ${rosterHtml}
              </div>
            </div>
          </div>
        </div>
      </main>
    `;
  }

  // ════════════════════════════════
  // INITIALIZATION / LOAD DATA
  // ════════════════════════════════
  async function initPage() {
    const params = new URLSearchParams(window.location.search);
    const tId = params.get('id');

    if(!tId) {
      // Default fallback if reached without ID
      renderTeam(ALL_DEMO_TEAMS[0]);
      return;
    }

    if(firebaseReady && db) {
      try {
        const doc = await db.collection('teams').doc(tId).get();
        if(doc.exists) {
          renderTeam({ id: doc.id, ...doc.data() });
        } else {
          // Try to find it in demo data just in case
          const fallback = ALL_DEMO_TEAMS.find(t => t.id === tId);
          renderTeam(fallback || null);
        }
      } catch(err) {
        console.warn('Firestore error:', err);
        const fallback = ALL_DEMO_TEAMS.find(t => t.id === tId);
        renderTeam(fallback || null);
      }
    } else {
      // Demo Mode
      setTimeout(() => {
        const t = ALL_DEMO_TEAMS.find(item => item.id === tId) || ALL_DEMO_TEAMS[0];
        renderTeam(t || null);
      }, 500);
    }
  }

  document.getElementById('copyright-year').textContent = new Date().getFullYear();
  initPage();
  </script>
</body>
</html>
